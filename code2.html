<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>code</title>
    </head>
    <style>
        #div1{
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        #div2{
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            gap: 5px;
        }
        #div3{
            margin-top: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0px;
            flex-direction: column;
            
            
        }
      
        #addBtn{
            width: 70px;
            height: 35px;
            background-color: rgb(48, 109, 241);
        }

        body{
            background-color:rgb(160, 160, 160);
            overflow: hidden;
        }
        #ansT{
            
            color: rgb(200, 255, 0); 

        }
        #sen{
            margin-top: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            gap: 5px;
        }
        

    </style>

    <body id="body">
        <audio id="successSound" src="code2.m4a"></audio>

        <div id="div1">Enter the code:</div>
        <div id="div2">
            <input id="inpt1">
        </div>
        <div id="div2">
            <button id="addBtn">Enter</button>
        </div>
        <div id="div3">
            <h1 id="ansT"></h1>
            <div id="sen"></div>
        </div>



    <script>
        let successSound = document.getElementById("successSound");

        let inpt1 = 
        document.getElementById("inpt1");
        let addBtn = 
        document.getElementById("addBtn");
        let ansT = 
        document.getElementById("ansT");
        let sen =
        document.getElementById("sen");
        
        addBtn.onclick = function(){
            let ans = 
            String(inpt1.value)
            if (ans === "آلفا"){
                ansT.textContent = "The code is correct";
                ansT.style.color = "green";
                successSound.currentTime = 0; // اگر دوباره کلیک شد از اول پخش شود
                successSound.play();"«خطا... هویت تأیید نشد. شما دکتر احسانی نیستید. اما... پس از سال‌ها، برای نخستین بار کسی موفق شده تمام مراحل امنیتی را پشت سر بگذارد. بر اساس وصیت ثبت‌شده، ادامه اطلاعات در اختیار شما قرار می‌گیرد.» «پروژه صفر هرگز برای ساخت یک ویروس طراحی نشده بود. هدف این پروژه، ساخت درمانی برای بیماری‌های ناشناخته بود. اما در جریان آزمایش‌ها، یک اشتباه باعث تغییر کامل نتایج شد و ویروس صفر به وجود آمد. دکتر احسانی تا آخرین روز زندگی خود روی ساخت واکسن کار کرد. پیش از مرگ، اطلاعات ساخت واکسن را در لپ‌تاپ شخصی خودش ذخیره کرد. رمز لپ‌تاپ در دو بخش پنهان شده است. بخش اول را با خط بریل... و بخش دوم را با کد مورس پیدا کنید.»";
            }
            else{
                ansT.textContent = "The code is wrong";
                ansT.style.color = "red";
                sen.textContent = "a";
            }

        }

</script>


</body>

</html>
